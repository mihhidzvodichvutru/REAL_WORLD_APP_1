name: BODOI Std - API Automated Testing (CI)
on:
  push:
    branches: [ "main" ]
jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install Backend Dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Start Backend Server
        run: pnpm start &
        env:
          DATABASE_URL: "postgresql://postgres.rndqxihcimghisvuxmsx:minhhidzvodichvutru@aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
          DIRECT_URL: "postgresql://postgres.rndqxihcimghisvuxmsx:minhhidzvodichvutru@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres"
          SECRET: "secret"
          NODE_ENV: "development"

      - name: Wait for Server to Boot
        run: sleep 10

      - name: Install Newman
        run: pnpm add -g newman newman-reporter-htmlextra
        
      - name: Run Postman Tests
        run: >
          newman run ./postman-tests/BODOI_Collection.json
          -e ./postman-tests/BODOI_Environment.json
          -r cli,htmlextra
          --reporter-htmlextra-export ./BODOI_Test_Report.html

      # BƯỚC MỚI 1: Cài đặt k6 trực tiếp lên máy ảo Ubuntu
     # BƯỚC MỚI 1: Cài đặt k6 trực tiếp lên máy ảo Ubuntu (Đã sửa lỗi GPG Key)
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      # BƯỚC MỚI 2: Kích hoạt kịch bản dội tải
      - name: Run Load Testing with k6
        run: k6 run loadtest.js
        env:
          # Đảm bảo port trùng khớp với port backend huynh đang chạy
          BASE_URL: 'http://localhost:3000/api'

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BODOI-API-Report
          path: ./BODOI_Test_Report.html